version: 4.1.{build}
skip_tags: true
skip_branch_with_pr: true
image: Visual Studio 2022

branches:
    only:
    - main

skip_commits:
    files:
    - .config/
    - .github/

environment:
  nodejs_version: 24

build_script:
- mkdir -p dist
- copy README.md dist\
- copy package.json dist\
- copy src\jquery.listadecompras.css dist\
- copy src\jquery.listadecompras.js dist\
- cmd: nuget pack jquery.listadecompras.nuspec -Version %APPVEYOR_BUILD_VERSION%

after_build:
- 7z a -tzip -mx9 "jquery.listadecompras.%APPVEYOR_BUILD_VERSION%.zip" dist

artifacts:
- path: '**\*nupkg'
  name: Package
  
- path: jquery.listadecompras.%APPVEYOR_BUILD_VERSION%.zip
  name: ZipFile

deploy:
- provider: NuGet
  api_key: $(NUGET_TOKEN)
  skip_symbols: true
  on:
   branch: main

- provider: GitHub
  on:
   branch: main
  tag: v$(appveyor_build_version)
  release: Release v$(appveyor_build_version)
  description: 'Release v$(appveyor_build_version)'
  auth_token: $(GITHUB_TOKEN)
  force_update: true
  artifact: Package
